name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  editor:
    name: Editor (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: macOS
          - runner: ubuntu-24.04
            host: Linux
          - runner: windows-2025
            host: Windows
    steps:
      - uses: actions/checkout@v7
        with:
          path: luced
      - name: Read dependency pins
        id: pins
        shell: bash
        run: |
          echo "base=$(cat luced/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(cat luced/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "ui=$(cat luced/bootstrap/UI)" >> "$GITHUB_OUTPUT"
          for pin in COLOR SVG CONFIG AI TEXTMATE REGEX JSON HTTP_CLIENT TLS CRYPTO; do
            key=$(printf '%s' "$pin" | tr '[:upper:]' '[:lower:]')
            echo "$key=$(cat luced/bootstrap/$pin)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-ui
          ref: ${{ steps.pins.outputs.ui }}
          path: luce-ui
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-color, ref: "${{ steps.pins.outputs.color }}", path: luce-color}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-svg, ref: "${{ steps.pins.outputs.svg }}", path: luce-svg}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-config, ref: "${{ steps.pins.outputs.config }}", path: luce-config}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-ai, ref: "${{ steps.pins.outputs.ai }}", path: luce-ai}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-textmate, ref: "${{ steps.pins.outputs.textmate }}", path: luce-textmate}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-regex, ref: "${{ steps.pins.outputs.regex }}", path: luce-regex}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-json, ref: "${{ steps.pins.outputs.json }}", path: luce-json}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-http-client, ref: "${{ steps.pins.outputs.http_client }}", path: luce-http-client}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-tls, ref: "${{ steps.pins.outputs.tls }}", path: luce-tls}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-crypto, ref: "${{ steps.pins.outputs.crypto }}", path: luce-crypto}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-vulkan-devel
      - name: Install Linux font backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core
      - name: Build native compilers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          (cd luce-base && CC=clang ./build.sh)
          (cd luce && LUCE_BASE_COMPILER=../luce-base/build/luce-base ./build.sh)
      - name: Build native compilers on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: |
          (cd luce-base && python tools/build_windows.py)
          (cd luce && python tools/build_windows.py)
      - name: Build and test editor behavior
        if: runner.os != 'Windows'
        shell: bash
        working-directory: luced
        run: |
          python3 tools/build.py
          python3 tests/run.py
      - name: Build and test editor behavior on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: luced
        env:
          CC: gcc
        run: |
          python3 tools/build.py
          python3 tests/run.py
      - name: Inspect actual Metal output
        if: runner.os == 'macOS'
        shell: bash
        working-directory: luced
        run: |
          python3 tools/preview.py --source examples/hello/main.luc
          python3 tools/preview.py --source src/editor/views.luc --fold --output build/preview-folded.ppm
          python3 tools/preview.py --source src/editor/views.luc --palette --output build/preview-palette.ppm
          python3 tools/preview.py --source src/editor/views.luc --context files --output build/preview-context.ppm
          python3 tools/preview.py --source src/editor/views.luc --hover edit-menu --output build/preview-menu-hover.ppm
          python3 tools/preview.py --source src/editor/views.luc --hover gutter --output build/preview-gutter-hover.ppm
          python3 tools/preview.py --source src/editor/views.luc --dock preview --output build/preview-docking.ppm
          python3 tools/preview.py --tabs --dock merge --output build/preview-tabs.ppm
      - name: Keep native preview
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: luced-metal-preview
          path: luced/build/preview*.ppm
